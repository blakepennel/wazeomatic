name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
      - name: OpenCV system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Emulator suite logic (no emulator)
        run: python -m unittest discover -s tools/emulator -p "test_*.py"
      - name: Tools import without the training extras
        run: python -m py_compile tools/eval_events.py tools/prepare_datasets.py tools/fetch_datasets.py tools/emulator/run_e2e.py

  android:
    name: Android apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Detector unit tests
        working-directory: android/detector
        run: bash ./gradlew testDebugUnitTest --no-daemon
      - name: Detector debug build
        working-directory: android/detector
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Mock Waze debug build
        working-directory: android/mockwaze
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detector-test-results
          path: android/detector/app/build/test-results/
          if-no-files-found: ignore
