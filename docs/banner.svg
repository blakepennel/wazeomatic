<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Wazeomatic</title>
  <desc id="d">Road hazards reported to Waze by a dashcam phone</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2937"/>
      <stop offset="0.55" stop-color="#374151"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <!-- A traffic cone with two reflective bands -->
    <g id="cone">
      <path d="M12 2.5 L17.5 18.5 H6.5 Z"/>
      <path d="M4 18.5 H20 V21 H4 Z"/>
      <path d="M8.9 11.5 H15.1 M7.6 15 H16.4"/>
    </g>
    <clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>

    <!-- Lane markings fading off the right edge -->
    <g stroke="#FFFFFF" stroke-linecap="round" fill="none">
      <path d="M860 330 L1010 60" stroke-width="10" stroke-opacity="0.10" stroke-dasharray="46 40"/>
      <path d="M1040 330 L1190 60" stroke-width="10" stroke-opacity="0.07" stroke-dasharray="46 40"/>
    </g>
    <!-- Cones along the lane -->
    <g fill="none" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
      <use href="#cone" transform="translate(1030 90) scale(7)" stroke-width="0.26" stroke-opacity="0.16"/>
      <use href="#cone" transform="translate(1150 160) scale(5)" stroke-width="0.3" stroke-opacity="0.12"/>
      <use href="#cone" transform="translate(930 190) scale(4)" stroke-width="0.34" stroke-opacity="0.09"/>
    </g>
  </g>

  <!-- Mark -->
  <rect x="88" y="96" width="128" height="128" rx="32" fill="#FFFFFF"/>
  <use href="#cone" transform="translate(152 160) scale(4.2) translate(-12 -11.75)" fill="none" stroke="#B45309" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="252" y="168" font-size="72" font-weight="700" letter-spacing="-2">Wazeomatic</text>
    <text x="254" y="214" font-size="27" font-weight="500" fill-opacity="0.92">Road hazards reported to Waze by your dashcam phone</text>
    <text x="255" y="252" font-size="17" font-weight="600" letter-spacing="2.5" fill-opacity="0.66">ON-DEVICE YOLO  ·  3 OF 10 FRAMES  ·  DRY RUN BY DEFAULT  ·  NO CLOUD</text>
  </g>
</svg>
